<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>lok-ai — reimagined</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0c0e; font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/LokaiShared.jsx"></script>
<script type="text/babel" src="components/LokaiHeroA.jsx"></script>
<script type="text/babel" src="components/LokaiHeroB.jsx"></script>
<script type="text/babel" src="components/LokaiServices.jsx"></script>
<script type="text/babel" src="components/LokaiBlogContact.jsx"></script>

<script type="text/babel">
const TWEAKS = /*EDITMODE-BEGIN*/{
  "accent": "mint",
  "intensity": 1,
  "showTicker": true
}/*EDITMODE-END*/;

function Frame({ children, h = 1800 }) {
  return (
    <div className="lokai" style={{ width: 1440, height: h, background: LOKAI.bg, color: LOKAI.text, position: 'relative', overflow: 'hidden' }}>
      {children}
    </div>
  );
}

function HomeA() {
  return (
    <Frame h={2600}>
      <LokaiNav />
      <LokaiHeroA />
      <LokaiServices />
      <LokaiContact />
      <LokaiFooter />
    </Frame>
  );
}

function HomeB() {
  return (
    <Frame h={2400}>
      <LokaiNav compact />
      <LokaiHeroB />
      <LokaiServices />
      <LokaiBlog />
      <LokaiFooter />
    </Frame>
  );
}

function ServicesPage() {
  return (
    <Frame h={1800}>
      <LokaiNav />
      <div style={{ padding: '80px 32px 0', maxWidth: 1280, margin: '0 auto', position: 'relative' }} className="lokai">
        <LokaiAurora intensity={0.5} />
        <div style={{ position: 'relative', zIndex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
            <span style={{ width: 28, height: 1, background: LOKAI.amber }} />
            <span className="mono" style={{ fontSize: 11, letterSpacing: '0.15em', textTransform: 'uppercase', color: LOKAI.amber }}>Usługi</span>
          </div>
          <h1 style={{ fontSize: 88, fontWeight: 700, letterSpacing: '-0.04em', lineHeight: 0.95, margin: '0 0 24px', maxWidth: 1100 }}>
            Od pomysłu do pracującego <span className="serif" style={{ fontStyle: 'italic', fontWeight: 400, color: LOKAI.amber }}>systemu</span>.
          </h1>
          <p style={{ fontSize: 19, color: LOKAI.textDim, maxWidth: 620, lineHeight: 1.55, margin: '0 0 48px' }}>
            Dobieramy rozwiązania do skali Twojej firmy — nie odwrotnie. Tu zobaczysz, co potrafimy.
          </p>
        </div>
      </div>
      <LokaiServices />
      <LokaiFooter />
    </Frame>
  );
}

function BlogPage() {
  return (
    <Frame h={1600}>
      <LokaiNav />
      <LokaiBlog />
      <LokaiFooter />
    </Frame>
  );
}

function ContactPage() {
  return (
    <Frame h={1400}>
      <LokaiNav />
      <div style={{ position: 'relative' }}>
        <LokaiAurora intensity={0.6} />
        <div style={{ position: 'relative', zIndex: 1 }}>
          <div style={{ maxWidth: 1280, margin: '0 auto', padding: '80px 32px 0' }} className="lokai">
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
              <span style={{ width: 28, height: 1, background: LOKAI.coral }} />
              <span className="mono" style={{ fontSize: 11, letterSpacing: '0.15em', textTransform: 'uppercase', color: LOKAI.coral }}>Kontakt</span>
            </div>
            <h1 style={{ fontSize: 88, fontWeight: 700, letterSpacing: '-0.04em', lineHeight: 0.95, margin: '0 0 24px', maxWidth: 900 }}>
              Powiedz nam, co Cię <span className="serif" style={{ fontStyle: 'italic', fontWeight: 400, color: LOKAI.coral }}>męczy</span>.
            </h1>
          </div>
          <LokaiContact />
        </div>
      </div>
      <LokaiFooter />
    </Frame>
  );
}

// Tweaks panel
function TweaksPanel({ open, onSet }) {
  if (!open) return null;
  return (
    <div style={{ position: 'fixed', bottom: 20, right: 20, width: 280, background: '#1a1b1e', color: '#ede7dc', borderRadius: 14, padding: 18, zIndex: 9999, outline: '1px solid rgba(255,255,255,0.1)', boxShadow: '0 20px 60px rgba(0,0,0,0.5)', fontFamily: 'Inter, sans-serif' }}>
      <div style={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", fontFeatureSettings: "'zero' 0", letterSpacing: '0.1em', textTransform: 'uppercase', color: '#f5b845', marginBottom: 14 }}>Tweaks</div>
      <div style={{ fontSize: 12, color: '#a8a29e', marginBottom: 8 }}>Akcent ciepły</div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
        {[['amber','#f5b845'],['coral','#ef7955'],['sand','#d9b88a'],['rust','#b8542f']].map(([k, c]) => (
          <button key={k} onClick={() => onSet({ accent: k })} style={{ flex: 1, height: 32, borderRadius: 8, border: 'none', background: c, cursor: 'pointer', opacity: 0.9 }} title={k} />
        ))}
      </div>
      <div style={{ fontSize: 11, color: '#78716c' }}>Zmiany są natychmiastowe. Pan/pan/zoom: scroll + pinch.</div>
    </div>
  );
}

function App() {
  const [tweakOpen, setTweakOpen] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(TWEAKS);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  return (
    <>
      <DesignCanvas minScale={0.1} maxScale={2}>
        <DCSection id="home" title="Strona główna" subtitle="Dwa warianty — editorial z chatbotem vs minimal">
          <DCArtboard id="home-a" label="A · Hero z live chatbotem" width={1440} height={2600}>
            <HomeA />
          </DCArtboard>
          <DCArtboard id="home-b" label="B · Editorial minimal" width={1440} height={2400}>
            <HomeB />
          </DCArtboard>
        </DCSection>

        <DCSection id="subpages" title="Podstrony" subtitle="Usługi · Blog · Kontakt">
          <DCArtboard id="services" label="Usługi" width={1440} height={1800}>
            <ServicesPage />
          </DCArtboard>
          <DCArtboard id="blog" label="Blog" width={1440} height={1600}>
            <BlogPage />
          </DCArtboard>
          <DCArtboard id="contact" label="Kontakt" width={1440} height={1400}>
            <ContactPage />
          </DCArtboard>
        </DCSection>

        <DCPostIt top={40} left={40} rotate={-3} width={260}>
          Dark mode został — dodałem trzeci kolor (amber/coral), animowaną aurorę w tle, live chatbot w Hero, ticker, liczniki i Instrument Serif kursywą jako display.
        </DCPostIt>

        <DCPostIt top={40} right={40} rotate={2} width={220}>
          Kliknij ⤢ na dowolnej ramce, aby przejrzeć w pełnym widoku. ← → nawiguje między wariantami.
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel open={tweakOpen} onSet={update} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
